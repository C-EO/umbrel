# This is important, we use Cloudflare for DNS because some users have routers that provide
# unreliable DNS that results in Docker errors when pulling like:
# Get "https://registry-1.docker.io/v2/tailscale/tailscale/manifests/sha256:d488853664499d792b359ea8c18f9a918b92e805b403733fe1c9aac9006ac8c1": dial tcp [2600:1f18:2148:bc01:571f:e759:a87a:2961]:443: connect: network is unreachable
#
# We use three different providers (Cloudflare, Quad9, Google) instead of two Cloudflare
# servers because some networks have a degraded path to a single provider (e.g. slow or
# filtered UDP/53 to Cloudflare anycast) which affects both of its servers equally.
# glibc only uses the first three nameservers so provider diversity beats redundancy.
#
# timeout:2 makes the resolver fail over to the next provider after 2 seconds instead of
# the 5 second default, otherwise a slow primary alone eats the whole HTTP timeout budget
# of things like app store git requests before the fallback is ever tried.
[global-dns]
options=timeout:2

[global-dns-domain-*]
servers=1.1.1.1,9.9.9.9,8.8.8.8
