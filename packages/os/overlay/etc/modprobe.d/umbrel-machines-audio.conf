# Eight loopback cards with eight PCM substreams each provide independent
# playback/capture pairs for up to 64 concurrently running Umbrel machines.
# Card indexes 8-15 stay clear of ordinary host audio hardware.
options snd-aloop index=8,9,10,11,12,13,14,15 id=UmbrelVM0,UmbrelVM1,UmbrelVM2,UmbrelVM3,UmbrelVM4,UmbrelVM5,UmbrelVM6,UmbrelVM7 enable=1,1,1,1,1,1,1,1 pcm_substreams=8,8,8,8,8,8,8,8
