version: '3.7'

services:
  app_proxy:
    image: getumbrel/app-proxy:1.7.0@sha256:ec0de0b944a2e63d52fdd82b3760d90a35f8b442d17a8407afdee3af3e842d5a
    # build: ../../../../../../containers/app-proxy
    user: '1000:1000'
    restart: on-failure
    hostname: $APP_PROXY_HOSTNAME
    ports:
      - '${APP_PROXY_BIND_IP}:${APP_PROXY_PUBLIC_PORT}:${APP_PROXY_PORT}'
    volumes:
      # TODO: Remove these bind-mount overrides after publishing an app-proxy image with the LAN ingress changes.
      - '${UMBREL_CONTAINER_SOURCE_DIR}/app-proxy/bin/www:/app/bin/www:ro'
      - '${UMBREL_CONTAINER_SOURCE_DIR}/app-proxy/routes/umbrel.js:/app/routes/umbrel.js:ro'
      - '${UMBREL_CONTAINER_SOURCE_DIR}/app-proxy/utils/auth.js:/app/utils/auth.js:ro'
      - '${UMBREL_CONTAINER_SOURCE_DIR}/app-proxy/utils/const.js:/app/utils/const.js:ro'
      - '${UMBREL_CONTAINER_SOURCE_DIR}/app-proxy/utils/proxy.js:/app/utils/proxy.js:ro'
      - '${APP_MANIFEST_FILE}:/extra/umbrel-app.yml:ro'
      - '${TOR_DATA_DIR}:/var/lib/tor:ro'
      - '${APP_DATA_DIR}:/data:ro'
    environment:
      LOG_LEVEL: info
      PROXY_PORT: $APP_PROXY_PORT
      PROXY_AUTH_ADD: 'true'
      PROXY_AUTH_WHITELIST:
      PROXY_AUTH_BLACKLIST:
      APP_HOST:
      APP_PORT:
      AUTH_SERVICE_PORT: $AUTH_PORT
      UMBREL_AUTH_PORT: $AUTH_PORT
      UMBREL_AUTH_SECRET: $UMBREL_AUTH_SECRET
      MANAGER_IP: $MANAGER_IP
      MANAGER_PORT: 3006
      JWT_SECRET: $JWT_SECRET
